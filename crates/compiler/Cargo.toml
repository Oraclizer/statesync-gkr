[package]
name = "ssgkr-compiler"
description = "SMT-to-layered-circuit compiler (Module 1): compiles sparse-Merkle-tree verification into the GKR circuit IR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ssgkr-primitives.workspace = true
# Depends on the GENERIC circuit IR; the reverse direction is forbidden.
ssgkr-protocol.workspace = true

# Creusot contracts (FV refinement track, R1 anchors live in this crate).
# cfg(creusot)-gated: compiled only under `cargo creusot`, invisible to
# normal builds on every platform (see the workspace manifest note).
[target.'cfg(creusot)'.dependencies]
creusot-std.workspace = true

[lints]
workspace = true
