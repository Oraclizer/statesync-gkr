[package]
name = "ssgkr-wrap"
description = "Module 4: external proof boundary - inner-proof-v1 canonical encoding, full circuit commitment, wrap statement (KoalaBear->BN254 bridge), swappable SNARK wrap backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = ["host"]
# Route-manifest and settlement policy are host governance surfaces. Keeping
# this default preserves direct ssgkr-wrap consumers while guests opt out.
host = ["dep:k256", "dep:serde", "dep:serde_json", "dep:sha3"]

[dependencies]
ssgkr-primitives.workspace = true
ssgkr-sumcheck.workspace = true
ssgkr-protocol.workspace = true
ssgkr-compiler.workspace = true
ssgkr-commitment.workspace = true
sha2.workspace = true
sha3 = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
