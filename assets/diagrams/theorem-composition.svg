<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656"
     role="img" aria-labelledby="composition-title composition-desc"
     preserveAspectRatio="xMidYMid meet">
  <title id="composition-title">Theorem composition in StateSync-GKR</title>
  <desc id="composition-desc">Compiler correctness and reduction soundness join at a single point and compose into one bound on the full state-to-proof path, discharged on a concrete non-vacuous instance. Batching sits below as a pointwise identity that holds over the whole path.</desc>
  <defs>
    <linearGradient id="composition-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061513"/>
      <stop offset=".62" stop-color="#0A2422"/>
      <stop offset="1" stop-color="#12312D"/>
    </linearGradient>
    <marker id="compose-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#75E3B0"/>
    </marker>
    <marker id="pointwise-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#66B8D2"/>
    </marker>
    <style>
      .text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#F3F7F4}
      .body{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#D5E4E0}
      .muted{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#9DB6B2}
      .mint{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#75E3B0}
      .blue{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;fill:#66B8D2}
      .node{fill:#091D1B;stroke:#2B5753;stroke-width:1.6}
      .state{fill:#0B2521;stroke:#75E3B0;stroke-width:1.8}
      .receipt{fill:#0A2224;stroke:#66B8D2;stroke-width:1.8}
      .compose{fill:#0B2521;stroke:#75E3B0;stroke-width:2.6}
      .flow{fill:none;stroke:#75E3B0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .rflow{fill:none;stroke:#66B8D2;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .rail{fill:none;stroke:#66B8D2;stroke-width:1.8;stroke-dasharray:7 6;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1200" height="656" rx="24" fill="url(#composition-bg)"/>
  <rect x="1" y="1" width="1198" height="654" rx="23" fill="none" stroke="#2B5753"/>
  <text x="54" y="52" class="text" font-size="27" font-weight="760">Theorem composition</text>
  <text x="54" y="78" class="muted" font-size="13" font-weight="700" letter-spacing="1.2">FOUR RESULTS CARRY THE COMPONENT • FIFTEEN THEORY FILES • NO SORRY, NO OOPS</text>

  <rect x="54" y="100" width="1092" height="356" rx="18" class="node"/>
  <text x="76" y="126" class="muted" font-size="11" font-weight="700" letter-spacing="1.3">COMPOSITION PATH</text>

  <rect x="86" y="138" width="460" height="128" rx="14" class="state"/>
  <text x="112" y="164" class="muted" font-size="11" font-weight="700" letter-spacing="1.3">THEOREM A • COMPILER CORRECTNESS</text>
  <text x="112" y="190" class="text" font-size="16" font-weight="720">Compiler correctness, both directions</text>
  <text x="112" y="214" class="body" font-size="12">Accepts a witness exactly when the modeled semantics hold.</text>
  <text x="112" y="236" class="mint" font-size="11">theorem_A_soundness · theorem_A_completeness</text>
  <text x="112" y="254" class="muted" font-size="10">session SMT_Circuit_Compiler_Correctness</text>

  <rect x="654" y="138" width="460" height="128" rx="14" class="receipt"/>
  <text x="680" y="164" class="muted" font-size="11" font-weight="700" letter-spacing="1.3">THEOREM B • REDUCTION SOUNDNESS</text>
  <text x="680" y="190" class="text" font-size="16" font-weight="720">A wrong output survives only within the bound</text>
  <text x="680" y="214" class="body" font-size="12">Against an arbitrary prover, and the bound is derived, not assumed.</text>
  <text x="680" y="236" class="blue" font-size="10.5">Sumcheck_Instance · Wiring_MLE · Layer_Representative</text>
  <text x="680" y="254" class="muted" font-size="10">GKR_Assembly · session GKR_Protocol</text>

  <path d="M316 266V288H600" class="flow"/>
  <path d="M884 266V288H600" class="rflow"/>
  <circle cx="600" cy="288" r="5" fill="#75E3B0"/>
  <path d="M600 288V310" class="flow" marker-end="url(#compose-arrow)"/>
  <text x="614" y="304" class="muted" font-size="11">compose into one bound</text>

  <rect x="350" y="310" width="500" height="130" rx="14" class="compose"/>
  <text x="376" y="336" class="muted" font-size="11" font-weight="700" letter-spacing="1.3">THEOREM C • FULL STATE-TO-PROOF PATH</text>
  <text x="376" y="362" class="text" font-size="17" font-weight="750">One bound on the whole path</text>
  <text x="376" y="386" class="body" font-size="12">Compiler correctness and reduction soundness compose into a single</text>
  <text x="376" y="403" class="body" font-size="12">bound, exercised where no witness can satisfy the operation.</text>
  <text x="376" y="423" class="mint" font-size="11">Composition.thy · session SMT_Circuit_Compiler_Correctness</text>

  <path d="M240 470H960" class="rail"/>
  <path d="M240 470V456M960 470V456" class="rail"/>
  <path d="M600 470V482" class="rflow" marker-end="url(#pointwise-arrow)"/>

  <rect x="54" y="482" width="1092" height="90" rx="16" class="receipt"/>
  <circle cx="80" cy="512" r="6" fill="#66B8D2"/>
  <text x="98" y="517" class="text" font-size="15" font-weight="720">Theorem D • batching is pointwise identity</text>
  <text x="98" y="541" class="body" font-size="12">Every proof from the independent-job batch path equals the single-job proof for the same job, so batching preserves acceptance and rejection pointwise.</text>
  <text x="98" y="560" class="blue" font-size="11">GKR_Batching.thy · session GKR_Protocol · holds pointwise over the whole path above</text>

  <rect x="54" y="590" width="1092" height="44" rx="10" fill="#12312D" stroke="#2B5753"/>
  <circle cx="78" cy="612" r="5" fill="#75E3B0"/>
  <text x="92" y="617" class="muted" font-size="12">Non-vacuity: concrete KoalaBear instances discharge every premise of Theorem A and Theorem C.</text>
  <circle cx="676" cy="612" r="5" fill="#66B8D2"/>
  <text x="690" y="617" class="muted" font-size="12">Results hold in their models under stated assumptions.</text>
</svg>
