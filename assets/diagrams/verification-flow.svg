<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"
     role="img" aria-labelledby="verification-title verification-desc"
     preserveAspectRatio="xMidYMid meet">
  <title id="verification-title">StateSync-GKR verification evidence flow</title>
  <desc id="verification-desc">Isabelle models connect through a documented partial mapping to Rust contracts and Creusot replay evidence. Executable tests and external proof, receipt, and bounded CDK L2 evidence are separate lanes.</desc>
  <defs>
    <linearGradient id="verification-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061513"/>
      <stop offset=".62" stop-color="#0A2422"/>
      <stop offset="1" stop-color="#12312D"/>
    </linearGradient>
    <marker id="verification-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#75E3B0"/>
    </marker>
    <marker id="evidence-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#66B8D2"/>
    </marker>
    <style>
      .text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#F3F7F4}
      .muted{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#9DB6B2}
      .model{fill:#0B2521;stroke:#75E3B0;stroke-width:1.8}
      .evidence{fill:#0A2224;stroke:#66B8D2;stroke-width:1.8}
      .external{fill:#261E13;stroke:#F4B85F;stroke-width:1.8;stroke-dasharray:8 6}
      .nonclaim{fill:#2B1716;stroke:#DB7868;stroke-width:1.7}
      .flow{fill:none;stroke:#75E3B0;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .eflow{fill:none;stroke:#66B8D2;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .dotted{fill:none;stroke:#F4B85F;stroke-width:1.8;stroke-dasharray:7 7}
    </style>
  </defs>

  <rect width="1200" height="820" rx="24" fill="url(#verification-bg)"/>
  <rect x="1" y="1" width="1198" height="818" rx="23" fill="none" stroke="#2B5753"/>
  <text x="54" y="57" class="text" font-size="28" font-weight="760">Verification evidence flow</text>
  <text x="54" y="84" class="muted" font-size="14">MECHANIZED MODEL • MAPPED CONTRACTS • EXECUTABLE TESTS • EXTERNAL EVIDENCE OUTSIDE REFINEMENT</text>

  <rect x="54" y="108" width="1092" height="292" rx="18" fill="#091D1B" stroke="#2B5753"/>
  <text x="76" y="136" class="muted" font-size="11" font-weight="700" letter-spacing="1.3">FORMAL MODEL AND MAPPED REFINEMENT LANE</text>

  <rect x="78" y="171" width="218" height="104" rx="14" class="model"/>
  <text x="187" y="201" class="text" font-size="15" font-weight="740" text-anchor="middle">Isabelle model</text>
  <text x="187" y="224" class="muted" font-size="11" text-anchor="middle">GKR_Protocol</text>
  <text x="187" y="244" class="muted" font-size="11" text-anchor="middle">SMT_Circuit_Compiler_</text>
  <text x="187" y="261" class="muted" font-size="11" text-anchor="middle">Correctness</text>

  <rect x="328" y="181" width="196" height="84" rx="14" class="model"/>
  <text x="426" y="212" class="text" font-size="14" font-weight="740" text-anchor="middle">Documented mapping</text>
  <text x="426" y="235" class="muted" font-size="11" text-anchor="middle">model → Rust anchors</text>
  <text x="426" y="252" class="muted" font-size="10" text-anchor="middle">scope + trusted boundary</text>

  <rect x="556" y="181" width="196" height="84" rx="14" class="model"/>
  <text x="654" y="211" class="text" font-size="14" font-weight="740" text-anchor="middle">Mapped contracts</text>
  <text x="654" y="234" class="muted" font-size="11" text-anchor="middle">cfg(creusot)</text>
  <text x="654" y="251" class="muted" font-size="10" text-anchor="middle">selected Rust surfaces</text>

  <rect x="784" y="171" width="336" height="104" rx="14" class="evidence"/>
  <text x="952" y="202" class="text" font-size="15" font-weight="740" text-anchor="middle">Creusot / Why3 evidence</text>
  <text x="952" y="226" class="muted" font-size="11" text-anchor="middle">verification-condition discharge</text>
  <text x="952" y="247" class="muted" font-size="11" text-anchor="middle">verif/**/proof.json replay metadata</text>
  <text x="952" y="264" class="muted" font-size="10" text-anchor="middle">explicit tool and trusted-computing-base limits</text>

  <path d="M296 223H328" class="flow" marker-end="url(#verification-arrow)"/>
  <path d="M524 223H556" class="flow" marker-end="url(#verification-arrow)"/>
  <path d="M752 223H784" class="flow" marker-end="url(#verification-arrow)"/>

  <rect x="78" y="308" width="280" height="58" rx="12" class="external"/>
  <text x="218" y="331" class="text" font-size="12" font-weight="700" text-anchor="middle">AFP Sumcheck_Protocol</text>
  <text x="218" y="351" fill="#F4B85F" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="10" text-anchor="middle">external formal dependency</text>
  <path d="M218 308V275" class="dotted"/>

  <rect x="390" y="308" width="730" height="58" rx="12" fill="#12312D" stroke="#2B5753"/>
  <text x="414" y="331" class="text" font-size="12" font-weight="700">Claim rule</text>
  <text x="414" y="351" class="muted" font-size="11">
    Evidence supports only the modeled theorem, mapped code, assumptions, and replayed scope named above.
  </text>

  <rect x="54" y="422" width="528" height="154" rx="18" fill="#091D1B" stroke="#2B5753"/>
  <text x="76" y="450" class="muted" font-size="11" font-weight="700" letter-spacing="1.3">EXECUTABLE EVIDENCE LANE</text>
  <rect x="78" y="476" width="480" height="72" rx="14" class="evidence"/>
  <text x="318" y="502" class="text" font-size="14" font-weight="740" text-anchor="middle">Rust test suites</text>
  <text x="318" y="525" class="muted" font-size="11" text-anchor="middle">unit • adversarial • differential • deterministic proof bytes</text>
  <text x="318" y="541" class="muted" font-size="10" text-anchor="middle">runtime conformance and regression evidence</text>

  <rect x="618" y="422" width="528" height="154" rx="18" fill="#091D1B" stroke="#2B5753" stroke-dasharray="8 6"/>
  <text x="640" y="450" fill="#F4B85F" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="11" font-weight="700" letter-spacing="1.3">SEPARATE INTEGRATION LANE</text>
  <rect x="642" y="476" width="480" height="72" rx="14" class="external"/>
  <text x="882" y="502" class="text" font-size="14" font-weight="740" text-anchor="middle">External proof + receipt + CDK L2</text>
  <text x="882" y="525" class="muted" font-size="11" text-anchor="middle">identity, receipt, transition, and compatibility evidence</text>
  <text x="882" y="541" fill="#F4B85F" font-family="ui-sans-serif,system-ui,sans-serif"
        font-size="10" text-anchor="middle">outside the established formal refinement claim</text>

  <path d="M318 400V476" class="eflow" marker-end="url(#evidence-arrow)"/>
  <path d="M882 400V476" class="dotted"/>

  <text x="54" y="619" class="muted" font-size="11" font-weight="700" letter-spacing="1.3">THIS EVIDENCE DOES NOT ESTABLISH</text>
  <rect x="54" y="640" width="528" height="62" rx="14" class="nonclaim"/>
  <circle cx="82" cy="671" r="6" fill="#DB7868"/>
  <text x="100" y="675" class="text" font-size="13">Poseidon2 or Fiat-Shamir cryptographic security</text>

  <rect x="618" y="640" width="528" height="62" rx="14" class="nonclaim"/>
  <circle cx="646" cy="671" r="6" fill="#DB7868"/>
  <text x="664" y="675" class="text" font-size="13">Whole-current-repository refinement</text>

  <rect x="54" y="718" width="528" height="62" rx="14" class="nonclaim"/>
  <circle cx="82" cy="749" r="6" fill="#DB7868"/>
  <text x="100" y="753" class="text" font-size="13">External backend or network soundness</text>

  <rect x="618" y="718" width="528" height="62" rx="14" class="nonclaim"/>
  <circle cx="646" cy="749" r="6" fill="#DB7868"/>
  <text x="664" y="753" class="text" font-size="13">L3 proof, Base settlement, or production readiness</text>
</svg>
