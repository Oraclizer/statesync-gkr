<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1800" viewBox="0 0 600 1800" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Selected Route B evidence for narrow screens</title>
  <desc id="desc">A vertical Route B view recording a RISC Zero proof, zkVerify receipt, observed delivery, destination experiment, and stored root. Actual CDK L3 execution, native proof, parent settlement, and Base confirmation remain external.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset="1" stop-color="#12312d"/></linearGradient>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#66b8d2"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#f4b85f"/></marker>
    <style>.stage{fill:#091d1b;stroke:#2b5753;stroke-width:2}.card{fill:#0a2224;stroke:#3d7669;stroke-width:2}.external{fill:#261e13;stroke:#f4b85f;stroke-width:2;stroke-dasharray:8 6}.defect{fill:#2a1715;stroke:#b65f52;stroke-width:2}.title{font:750 28px Inter,Segoe UI,Arial,sans-serif;fill:#f3f7f4}.label{font:700 19px Inter,Segoe UI,Arial,sans-serif;fill:#f3f7f4}.text{font:16px Inter,Segoe UI,Arial,sans-serif;fill:#d5e4e0}.small{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#9db6b2}.eyebrow{font:700 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.5px;fill:#75e3b0}.flow{fill:none;stroke:#66b8d2;stroke-width:3;marker-end:url(#blue-arrow)}.dotted{fill:none;stroke:#f4b85f;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#amber-arrow)}</style>
  </defs>
  <rect width="600" height="1800" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="598" height="1798" rx="23" fill="none" stroke="#2b5753" stroke-width="2"/>
  <text class="title" x="30" y="52">Selected Route B evidence</text>
  <text x="30" y="82" fill="#f4b85f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Composite evidence; production deployment not established</text>

  <rect class="stage" x="24" y="112" width="552" height="900" rx="22"/>
  <text class="eyebrow" x="48" y="152">OBSERVED FLOW</text>
  <rect class="card" x="84" y="178" width="432" height="78" rx="14"/><text class="label" x="300" y="210" text-anchor="middle">RISC Zero proof</text><text class="small" x="300" y="235" text-anchor="middle">proof bytes + public values</text>
  <path class="dotted" d="M300 256v34"/>
  <rect class="external" x="84" y="294" width="432" height="78" rx="14"/><text class="label" x="300" y="326" text-anchor="middle">zkVerify</text><text class="small" x="300" y="351" text-anchor="middle">verification + aggregation</text>
  <path class="dotted" d="M300 372v34"/>
  <rect class="external" x="84" y="410" width="432" height="78" rx="14"/><text class="label" x="300" y="442" text-anchor="middle">authorized-account</text><text x="300" y="467" text-anchor="middle" fill="#f4b85f" font-size="14">recorded observation</text>
  <path class="dotted" d="M300 488v34"/>
  <rect class="card" x="84" y="526" width="432" height="78" rx="14"/><text class="label" x="300" y="558" text-anchor="middle">destination gateway</text><text class="small" x="300" y="583" text-anchor="middle">observed delivery</text>
  <path class="flow" d="M300 604v34"/>
  <rect class="card" x="84" y="642" width="432" height="78" rx="14"/><text class="label" x="300" y="674" text-anchor="middle">stored root</text><text class="small" x="300" y="699" text-anchor="middle">receipt root + membership</text>

  <rect class="external" x="48" y="760" width="504" height="102" rx="16"/>
  <circle cx="72" cy="793" r="7" fill="#f4b85f"/><text class="label" x="92" y="800">Destination trust boundary</text>
  <text class="small" x="72" y="830">The recorded evidence does not establish execution on a live L3.</text>
  <path class="flow" d="M300 720v36"/><path class="flow" d="M300 862v24"/>
  <rect class="card" x="84" y="890" width="432" height="78" rx="14"/><text class="label" x="300" y="922" text-anchor="middle">future settlement consumer</text><text class="small" x="300" y="947" text-anchor="middle">not present in this repository</text>

  <rect class="stage" x="24" y="1058" width="552" height="272" rx="22"/>
  <text class="eyebrow" x="48" y="1098">REFERENCE CONTROLS · NOT A LIVE DEPLOYMENT</text>
  <rect class="defect" x="48" y="1122" width="504" height="82" rx="14"/><circle cx="72" cy="1151" r="7" fill="#db7868"/><text class="label" x="92" y="1158">Conflicting coordinate rejected</text><text class="small" x="72" y="1184">No root may resolve to a different destination tuple.</text>
  <rect class="defect" x="48" y="1222" width="504" height="82" rx="14"/><circle cx="72" cy="1251" r="7" fill="#db7868"/><text class="label" x="92" y="1258">Canonical one-leaf tuple enforced</text><text class="small" x="72" y="1284">The expected proof binds leaf, state, root, depth, path, and index.</text>

  <rect class="stage" x="24" y="1376" width="552" height="330" rx="22"/>
  <text class="eyebrow" x="48" y="1416">REQUIRED BEFORE A PRODUCTION SETTLEMENT PATH</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#d5e4e0">
    <circle cx="58" cy="1460" r="15" fill="#12312d" stroke="#75e3b0"/><text x="58" y="1466" text-anchor="middle" fill="#75e3b0" font-weight="800">1</text><text x="84" y="1466">Use fresh principals and addresses</text>
    <circle cx="58" cy="1510" r="15" fill="#12312d" stroke="#75e3b0"/><text x="58" y="1516" text-anchor="middle" fill="#75e3b0" font-weight="800">2</text><text x="84" y="1516">Complete human security and custody review</text>
    <circle cx="58" cy="1560" r="15" fill="#12312d" stroke="#75e3b0"/><text x="58" y="1566" text-anchor="middle" fill="#75e3b0" font-weight="800">3</text><text x="84" y="1566">Set numeric policy and recovery objectives</text>
    <circle cx="58" cy="1610" r="15" fill="#12312d" stroke="#75e3b0"/><text x="58" y="1616" text-anchor="middle" fill="#75e3b0" font-weight="800">4</text><text x="84" y="1616">Execute actual CDK L3 + native proof</text>
    <circle cx="58" cy="1660" r="15" fill="#12312d" stroke="#75e3b0"/><text x="58" y="1666" text-anchor="middle" fill="#75e3b0" font-weight="800">5</text><text x="84" y="1666">Confirm parent settlement and Base finality</text>
  </g>
  <text class="small" x="30" y="1770">External evidence and a reference transition do not establish production settlement.</text>
</svg>
