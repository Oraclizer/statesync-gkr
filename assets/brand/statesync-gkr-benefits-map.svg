<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1008" viewBox="0 0 1200 1008" role="img" aria-labelledby="title desc">
<title id="title">Nine implementation benefits in three practical groups</title><desc id="desc">All nine mechanisms remain visible. Resource use: sparse reduction, cube and affine fusion, parallel Merkle constraints. Repeated execution: derived wiring, prepared reuse, independent proof jobs. Meaning and reuse: three-state lifecycle, strict codec and request binding, reusable sumcheck/GKR core with formal models. Evidence types differ; these are not nine independently isolated causal experiments.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset="1" stop-color="#12312D"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#75E3B0" stroke-width="1" opacity=".045"/></pattern></defs>
<rect width="1200" height="1008" rx="22" fill="url(#bg)"/><rect width="1200" height="1008" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="1006" rx="21" fill="none" stroke="#315C53"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="40" y="45" fill="#75E3B0" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.4">DESIGN → BENEFIT → EVIDENCE</text><text x="40" y="101" fill="#F3F7F4" font-size="42" font-weight="700" text-anchor="start">Nine advantages. One reusable engine.</text><text x="54" y="156" fill="#75E3B0" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.7">USE RESOURCES WELL</text><rect x="36" y="180" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="60" y="225" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Fit more work</text><text x="60" y="258" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">within your RAM.</text><text x="60" y="301" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Sparse layer reduction</text><text x="60" y="350" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">MEASUREMENT + SOURCE</text><text x="60" y="378" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Same-driver Dense / Sparse</text><rect x="36" y="432" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="60" y="477" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Keep hash rounds</text><text x="60" y="510" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">compact.</text><text x="60" y="553" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Cube gates + affine fusion</text><text x="60" y="602" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">SOURCE STRUCTURE</text><text x="60" y="630" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">No separate speed multiplier</text><rect x="36" y="684" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="60" y="729" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Grow the path.</text><text x="60" y="762" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Keep proof growth modest.</text><text x="60" y="805" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Parallel Merkle constraints</text><text x="60" y="854" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">SHAPE + PROOF BYTES</text><text x="60" y="882" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Membership: +2.93%, depth 24 → 32</text><text x="438" y="156" fill="#75E3B0" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.7">REPEAT EFFICIENTLY</text><rect x="420" y="180" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="444" y="225" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Check familiar</text><text x="444" y="258" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">structure faster.</text><text x="444" y="301" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Derived wiring</text><text x="444" y="350" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">MEASUREMENT + MODEL</text><text x="444" y="378" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Same-proof Table / Derived</text><rect x="420" y="432" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="444" y="477" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Prepare once.</text><text x="444" y="510" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Reuse the setup.</text><text x="444" y="553" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Circuit + commitment reuse</text><text x="444" y="602" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">DIRECT MEASUREMENT</text><text x="444" y="630" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">3.46–4.45× lower per-request time</text><rect x="420" y="684" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="444" y="729" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Use the workers.</text><text x="444" y="762" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Keep each result distinct.</text><text x="444" y="805" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Independent proof jobs</text><text x="444" y="854" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">MEASUREMENT + CONTROLS</text><text x="444" y="882" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">One job → one proof</text><text x="822" y="156" fill="#75E3B0" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.7">KEEP THE MEANING</text><rect x="804" y="180" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="828" y="225" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Distinguish unused,</text><text x="828" y="258" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">live and deleted state.</text><text x="828" y="301" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Three-state leaf lifecycle</text><text x="828" y="350" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">SEMANTICS + CONTROLS</text><text x="828" y="378" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Empty / occupied / tombstone</text><rect x="804" y="432" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="828" y="477" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Accept the proof</text><text x="828" y="510" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">for the original request.</text><text x="828" y="553" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Strict codec + request binding</text><text x="828" y="602" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">REJECTION CONTROLS</text><text x="828" y="630" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Complete encoded proof checked</text><rect x="804" y="684" width="360" height="230" rx="14" fill="#0A211D" stroke="#315C53"/><text x="828" y="729" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Build a different</text><text x="828" y="762" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">circuit frontend.</text><text x="828" y="805" fill="#8ED3E1" font-size="16" font-weight="600" text-anchor="start">Reusable sumcheck / GKR core</text><text x="828" y="854" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.25">SOURCE + FORMAL MODELS</text><text x="828" y="882" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Rust connection</text><text x="828" y="901" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">partial, conditional</text><text x="42" y="960" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Measurements, structure, rejection controls and formal models play different roles.</text><text x="42" y="986" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">These are nine connected mechanisms, not nine independently isolated causal experiments.</text></g></svg>
