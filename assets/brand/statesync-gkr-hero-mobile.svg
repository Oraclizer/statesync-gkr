    <text x="314" y="150" fill="#f3f7f4" font-size="38" font-weight="800" letter-spacing=".7">STATESYNC-GKR</text>
    <rect x="318" y="171" width="72" height="5" rx="2.5" fill="#75e3b0"/>
    <text x="314" y="218" fill="#d5e4e0" font-size="16" font-weight="650">GKR PROVING FOR SPARSE-MERKLE</text>
    <text x="314" y="245" fill="#d5e4e0" font-size="16" font-weight="650">STATE TRANSITIONS</text>
