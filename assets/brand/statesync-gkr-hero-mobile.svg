<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">StateSync-GKR for narrow screens</title>
  <desc id="desc">A compact mobile banner where sparse state cells flow through layered reductions into a compact claim beside the StateSync-GKR project name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset=".58" stop-color="#0a2422"/><stop offset="1" stop-color="#12312d"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" fill="none" stroke="#75e3b0" stroke-width="1" opacity=".035"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75e3b0"/></marker>
  </defs>
  <rect width="640" height="320" rx="24" fill="url(#bg)"/>
  <rect width="640" height="320" rx="24" fill="url(#grid)"/>
  <path d="M28 72V28h44M568 28h44v44M28 248v44h44M568 292h44v-44" fill="none" stroke="#75e3b0" stroke-width="2" opacity=".12"/>
