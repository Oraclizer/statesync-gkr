    <g fill="#75e3b0"><circle cx="17" cy="17" r="5"/><circle cx="61" cy="61" r="5"/><circle cx="17" cy="105" r="5"/></g>
    <path d="M78 17h34l34 44M78 61h68M78 105h34l34-44" fill="none" stroke="#66b8d2" stroke-width="3"/>
    <circle cx="146" cy="61" r="9" fill="#66b8d2"/>
    <path d="M155 61h44" fill="none" stroke="#75e3b0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="204" y="34" width="52" height="54" rx="10" fill="#0a2224" stroke="#75e3b0" stroke-width="2"/>
    <path d="M216 50h28M216 61h22M216 72h28" stroke="#75e3b0" stroke-width="3" stroke-linecap="round"/>
