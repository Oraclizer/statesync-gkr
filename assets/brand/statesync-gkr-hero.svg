<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="hero-title hero-desc" preserveAspectRatio="xMidYMid meet">
  <title id="hero-title">StateSync-GKR experimental Rust prover component</title>
  <desc id="hero-desc">Sparse state cells flow through layered reductions into a compact claim beside the StateSync-GKR project name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061513"/>
      <stop offset="0.58" stop-color="#0A2422"/>
      <stop offset="1" stop-color="#12312D"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2B5753" stroke-width=".7" opacity=".28"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#75E3B0"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#2B5753"/>
  <path d="M34 46H1166M34 254H1166" stroke="#2B5753" opacity=".48"/>
  <rect x="34" y="46" width="1132" height="208" fill="url(#grid)" opacity=".35"/>

  <g transform="translate(56 74)">
    <text x="0" y="-11" fill="#9DB6B2" font-family="ui-sans-serif,system-ui,sans-serif"
          font-size="11" font-weight="700" letter-spacing="1.6">SPARSE STATE</text>
    <g fill="#091D1B" stroke="#2B5753" stroke-width="1.5">
      <rect x="0" y="0" width="34" height="34" rx="7"/><rect x="44" y="0" width="34" height="34" rx="7"/>
      <rect x="88" y="0" width="34" height="34" rx="7"/><rect x="0" y="44" width="34" height="34" rx="7"/>
      <rect x="44" y="44" width="34" height="34" rx="7"/><rect x="88" y="44" width="34" height="34" rx="7"/>
      <rect x="0" y="88" width="34" height="34" rx="7"/><rect x="44" y="88" width="34" height="34" rx="7"/>
      <rect x="88" y="88" width="34" height="34" rx="7"/>
    </g>
    <rect x="47" y="3" width="28" height="28" rx="5" fill="#12312D" stroke="#75E3B0"/>
    <rect x="91" y="47" width="28" height="28" rx="5" fill="#12312D" stroke="#66B8D2"/>
    <circle cx="61" cy="17" r="4" fill="#75E3B0"/><circle cx="105" cy="61" r="4" fill="#66B8D2"/>
  </g>

  <g transform="translate(208 80)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <text x="0" y="-17" fill="#9DB6B2" font-family="ui-sans-serif,system-ui,sans-serif"
          font-size="11" font-weight="700" letter-spacing="1.6">LAYERED REDUCTION</text>
    <path d="M0 22H34M0 62H34M0 102H34M0 142H34" stroke="#75E3B0" stroke-width="1.5"/>
    <path d="M34 22L72 42M34 62L72 42M34 102L72 122M34 142L72 122" stroke="#2B5753" stroke-width="1.5"/>
    <path d="M72 42L112 82M72 122L112 82" stroke="#66B8D2" stroke-width="1.8"/>
    <g fill="#75E3B0" stroke="none">
      <circle cx="0" cy="22" r="5"/><circle cx="0" cy="62" r="5"/>
      <circle cx="0" cy="102" r="5"/><circle cx="0" cy="142" r="5"/>
    </g>
    <g fill="#091D1B" stroke="#66B8D2" stroke-width="2">
      <circle cx="72" cy="42" r="6"/><circle cx="72" cy="122" r="6"/>
    </g>
    <circle cx="112" cy="82" r="7" fill="#66B8D2" stroke="none"/>
    <path d="M124 82H146" stroke="#75E3B0" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(390 69)" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="0" y="0" fill="#75E3B0" font-size="12" font-weight="750" letter-spacing="2.4">EXPERIMENTAL RUST PROVER COMPONENT</text>
    <text x="0" y="58" fill="#F3F7F4" font-size="53" font-weight="800" letter-spacing="1.2">STATESYNC-GKR</text>
    <rect x="0" y="77" width="112" height="3" rx="1.5" fill="#75E3B0"/>
    <text x="0" y="111" fill="#D5E4E0" font-size="17" font-weight="650" letter-spacing=".7">GKR PROVING FOR SPARSE-MERKLE STATE TRANSITIONS</text>
    <text x="0" y="148" fill="#9DB6B2" font-size="14">SMT semantics • layered reduction • canonical proof boundary</text>
  </g>

  <g transform="translate(1008 82)" font-family="ui-sans-serif,system-ui,sans-serif">
