<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1196" viewBox="0 0 480 1196" role="img" aria-labelledby="title desc">
<title id="title">StateSync-GKR v1.2.0: shorter latency tails and more requests within one second</title><desc id="desc">StateSync-GKR v1.2.0 serving results against v1.1.0 measured the same day on the same VM types, with the reference proof server in continuous mode, the membership, non-membership and update 1:1:1 mix at depth 24, and a separate frontend that verifies every complete proof. On one 192-core VM at 1,000 requests per second, p99 latency from scheduled arrival to verified acceptance fell from 440 ms to 34 ms, the medians of three 60-second runs per release. The highest offered rate with every timed request accepted within one second rose from 500 to 2,000 requests per second on 48 cores and from 500 to 3,000 on 96 cores, in screens with one 15-second run per rate. On 192 cores it reached 3,300 requests per second on one connection in three 60-second confirmation runs and a 30-minute run, against 1,000 for v1.1.0 in the earlier campaign and 1,150 in one 60-second run, the highest rate tried, on the same day. With two connections, 15-second screens passed every rate up to 5,000 requests per second, where the frontend reached its own limit, so 5,000 is a lower bound. Proof bytes are unchanged.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset="1" stop-color="#12312D"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#75E3B0" stroke-width="1" opacity=".045"/></pattern></defs>
<rect width="480" height="1196" rx="22" fill="url(#bg)"/><rect width="480" height="1196" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="478" height="1194" rx="21" fill="none" stroke="#315C53"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="26" y="40" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.1">STATESYNC-GKR / V1.2.0 SERVING</text><text x="26" y="86" fill="#F3F7F4" font-size="34" font-weight="700" text-anchor="start">Same servers,</text><text x="26" y="126" fill="#F3F7F4" font-size="34" font-weight="700" text-anchor="start">more proofs on time.</text><text x="26" y="160" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Release 1.2.0 against release 1.1.0,</text><text x="26" y="184" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">same VM types, measured the same day</text><rect x="22" y="212" width="436" height="340" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="246" fill="#75E3B0" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1">P99 LATENCY AT 1,000/S</text><text x="46" y="324" fill="#F3F7F4" font-size="68" font-weight="700" text-anchor="start">34 ms</text><rect x="256.81" y="288" width="105.96" height="36" rx="18" fill="#12332D" stroke="#75E3B0"/><text x="309.79" y="312" fill="#75E3B0" font-size="17" font-weight="700" text-anchor="middle">13× lower</text><text x="46" y="358" fill="#A9C3BD" font-size="17" font-weight="600" text-anchor="start">on one 192-core VM, down from 440 ms</text><text x="46" y="402" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">v1.1.0, same day</text><text x="434" y="402" fill="#A9C3BD" font-size="15" font-weight="700" text-anchor="end">440 ms</text><rect x="46" y="414" width="388" height="13" rx="3" fill="#55786C"/><text x="46" y="456" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="start">v1.2.0, continuous mode</text><text x="434" y="456" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="end">34 ms</text><rect x="46" y="468" width="388" height="13" rx="3" fill="#1A3930"/><rect x="46" y="468" width="29.8" height="13" rx="0" fill="#75E3B0"/><text x="46" y="514" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Scheduled arrival to verified acceptance</text><text x="46" y="538" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Median of three 60-s runs per release</text><rect x="22" y="572" width="436" height="432" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="606" fill="#75E3B0" font-size="14" font-weight="700" text-anchor="start" letter-spacing="1">HIGHEST RATE, EVERY REQUEST IN 1 S</text><rect x="46" y="624" width="12" height="12" rx="2" fill="#55786C"/><text x="64" y="635" fill="#A9C3BD" font-size="13" font-weight="400" text-anchor="start">v1.1.0, same day</text><rect x="181" y="624" width="12" height="12" rx="2" fill="#75E3B0"/><text x="199" y="635" fill="#A9C3BD" font-size="13" font-weight="400" text-anchor="start">v1.2.0, continuous</text><text x="46" y="674" fill="#F3F7F4" font-size="16" font-weight="700" text-anchor="start">48 cores</text><rect x="46" y="684" width="30" height="12" rx="3" fill="#55786C"/><text x="84" y="695" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">500/s</text><rect x="46" y="702" width="300" height="16" rx="3" fill="#1A3930"/><rect x="46" y="702" width="120" height="16" rx="3" fill="#75E3B0"/><text x="174" y="716" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start">2,000/s</text><text x="46" y="750" fill="#F3F7F4" font-size="16" font-weight="700" text-anchor="start">96 cores</text><rect x="46" y="760" width="30" height="12" rx="3" fill="#55786C"/><text x="84" y="771" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">500/s</text><rect x="46" y="778" width="300" height="16" rx="3" fill="#1A3930"/><rect x="46" y="778" width="180" height="16" rx="3" fill="#75E3B0"/><text x="234" y="792" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start">3,000/s</text><text x="46" y="826" fill="#F3F7F4" font-size="16" font-weight="700" text-anchor="start">192 cores</text><rect x="46" y="836" width="69" height="12" rx="3" fill="#55786C"/><text x="123" y="847" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">1,000–1,150/s</text><line x1="106" y1="833" x2="106" y2="851" stroke="#C5F5DE" stroke-width="2"/><rect x="46" y="854" width="300" height="16" rx="3" fill="#1A3930"/><rect x="46" y="854" width="198" height="16" rx="3" fill="#75E3B0"/><text x="252" y="868" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start">3,300/s</text><rect x="46" y="880" width="300" height="10" rx="3" fill="none" stroke="#75E3B0" stroke-dasharray="5 4" stroke-width="1.5"/><rect x="46" y="880" width="198" height="10" rx="3" fill="#75E3B0" opacity=".35"/><text x="46" y="910" fill="#A9C3BD" font-size="13" font-weight="400" text-anchor="start">Two connections: 5,000/s or more (frontend-limited)</text><text x="46" y="964" fill="#A9C3BD" font-size="13" font-weight="400" text-anchor="start">48/96 cores, two connections: 15-s screens</text><text x="46" y="984" fill="#A9C3BD" font-size="13" font-weight="400" text-anchor="start">192 cores: three 60-s runs and a 30-min run</text><text x="28" y="1040" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start">Same day, same VM types, same proof bytes.</text><text x="28" y="1068" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Reference proof server in continuous mode;</text><text x="28" y="1090" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">1:1:1 mix at depth 24; a separate frontend</text><text x="28" y="1112" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">verifies every complete proof. 192-core v1.1.0:</text><text x="28" y="1134" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">1,000/s in the earlier campaign; 1,150/s,</text><text x="28" y="1156" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">the highest rate tried, on the same day.</text><text x="28" y="1178" fill="#75E3B0" font-size="14" font-weight="400" text-anchor="start">Measured v1.2.0 and v1.1.0 · full conditions in docs</text></g></svg>
