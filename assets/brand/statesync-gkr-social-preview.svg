    <g fill="#091d1b" stroke="#386761" stroke-width="1.5">
      <rect x="0" y="0" width="42" height="42" rx="8"/><rect x="54" y="0" width="42" height="42" rx="8"/><rect x="108" y="0" width="42" height="42" rx="8"/>
      <rect x="0" y="54" width="42" height="42" rx="8"/><rect x="54" y="54" width="42" height="42" rx="8"/><rect x="108" y="54" width="42" height="42" rx="8"/>
      <rect x="0" y="108" width="42" height="42" rx="8"/><rect x="54" y="108" width="42" height="42" rx="8"/><rect x="108" y="108" width="42" height="42" rx="8"/>
    </g>
    <rect x="58" y="4" width="34" height="34" rx="6" fill="#153a32" stroke="#75e3b0" stroke-width="2"/>
    <rect x="112" y="58" width="34" height="34" rx="6" fill="#153a32" stroke="#66b8d2" stroke-width="2"/>
    <circle cx="75" cy="21" r="5" fill="#75e3b0"/><circle cx="129" cy="75" r="5" fill="#66b8d2"/>

    <g transform="translate(188 0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <text x="0" y="-22" fill="#9db6b2" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">LAYERED REDUCTION</text>
      <path d="M0 20H35M0 58H35M0 96H35M0 134H35" stroke="#75e3b0" stroke-width="2"/>
      <path d="M35 20L76 39M35 58L76 39M35 96L76 115M35 134L76 115" stroke="#386761" stroke-width="2"/>
      <path d="M76 39L120 77M76 115L120 77" stroke="#66b8d2" stroke-width="2.4"/>
