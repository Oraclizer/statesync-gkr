  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="566" y="124" fill="#75e3b0" font-size="17" font-weight="750" letter-spacing="3.1">EXPERIMENTAL RUST PROVER COMPONENT</text>
    <text x="558" y="230" fill="#f3f7f4" font-size="72" font-weight="800" letter-spacing="1.1">STATESYNC-GKR</text>
