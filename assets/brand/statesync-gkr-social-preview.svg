<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">StateSync-GKR social preview</title>
  <desc id="desc">StateSync-GKR, a Rust prover component for sparse-Merkle state transitions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04120f"/>
      <stop offset="0.58" stop-color="#092621"/>
      <stop offset="1" stop-color="#12372f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#3d6c64" stroke-width="1" opacity="0.14"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#75e3b0"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#010806" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <path d="M500 64v512M520 64v512" stroke="#75e3b0" stroke-width="1" opacity="0.11"/>
  <path d="M1180 66h40v40M1220 534v40h-40" fill="none" stroke="#75e3b0" stroke-width="2" opacity="0.18"/>

  <g transform="translate(42 190) scale(1.35)" filter="url(#shadow)">
