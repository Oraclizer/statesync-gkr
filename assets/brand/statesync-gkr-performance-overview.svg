<g font-family="Arial,Helvetica,sans-serif"><text x="40" y="44" fill="#75E3B0" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.8">STATESYNC-GKR / REUSABLE RUST ENGINE</text><text x="40" y="105" fill="#F3F7F4" font-size="48" font-weight="700" text-anchor="start">Proofs with less repeated work.</text><text x="42" y="147" fill="#A9C3BD" font-size="21" font-weight="400" text-anchor="start">Sparse-Merkle transitions · independent jobs · inspectable evidence</text><rect x="36" y="188" width="360" height="410" rx="16" fill="#0A211D" stroke="#315C53"/><text x="60" y="222" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">MEMORY</text><text x="60" y="303" fill="#F3F7F4" font-size="66" font-weight="700" text-anchor="start">89.46×</text><text x="60" y="336" fill="#A9C3BD" font-size="17" font-weight="600" text-anchor="start">lower peak process RAM</text><text x="60" y="377" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">SS-GKR Dense ref</text><text x="372" y="377" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="end">1,811.54 MiB</text><rect x="60" y="389" width="312" height="13" rx="3" fill="#55786C"/><text x="60" y="438" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="start">SS-GKR Sparse</text><text x="372" y="438" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="end">20.25 MiB</text><rect x="60" y="450" width="312" height="13" rx="3" fill="#1A3930"/><rect x="60" y="450" width="3.4876421551080963" height="13" rx="0" fill="#75E3B0"/><text x="60" y="508" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Mixed, 2-layer circuit · width 4,096</text><text x="60" y="534" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Same circuit, field and prover driver</text><text x="60" y="574" fill="#A9C3BD" font-size="13" font-weight="400" text-anchor="start">Actual RAM, not requested allocation</text><rect x="420" y="188" width="360" height="410" rx="16" fill="#0A211D" stroke="#315C53"/><text x="444" y="222" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">PREPARED VERIFICATION</text><text x="756" y="222" fill="#A9C3BD" font-size="16" font-weight="700" text-anchor="end">UP TO</text><text x="444" y="303" fill="#F3F7F4" font-size="66" font-weight="700" text-anchor="start">23.68×</text><text x="444" y="336" fill="#A9C3BD" font-size="17" font-weight="600" text-anchor="start">faster whole typed verification</text><text x="444" y="377" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Table wiring</text><text x="756" y="377" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="end">1×</text><rect x="444" y="389" width="13.0" height="13" rx="3" fill="#55786C"/><text x="444" y="438" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="start">Derived wiring</text><text x="756" y="438" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="end">23.68×</text><rect x="444" y="450" width="307.7839627753545" height="13" rx="3" fill="#75E3B0"/><text x="444" y="508" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Update · depth 32 · same proof</text><text x="444" y="534" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Preparation excluded; Table is sparse</text><text x="444" y="574" fill="#A9C3BD" font-size="13" font-weight="400" text-anchor="start">Relative speed; nine profiles: 10.80–23.68×</text><rect x="804" y="188" width="360" height="410" rx="16" fill="#0A211D" stroke="#315C53"/><text x="828" y="222" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">COMPLETE LOCAL BATCH</text><text x="828" y="303" fill="#F3F7F4" font-size="45" font-weight="700" text-anchor="start">9.71–10.71×</text><text x="828" y="336" fill="#A9C3BD" font-size="17" font-weight="600" text-anchor="start">faster whole prepared batches</text><text x="828" y="377" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Serial output</text><text x="1140" y="377" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="end">1×</text><rect x="828" y="389" width="26.0" height="13" rx="3" fill="#55786C"/><text x="828" y="438" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="start">Parallel output</text><text x="1140" y="438" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="end">9.71–10.71×</text><rect x="828" y="450" width="252.36068937697613" height="13" rx="3" fill="#75E3B0"/><rect x="1080.360689376976" y="450" width="26.033692037038474" height="13" rx="0" fill="#C5F5DE"/><text x="828" y="508" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Depth 24 · batch 768 · 192 workers</text><text x="828" y="534" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Range spans three operation medians</text><text x="828" y="574" fill="#A9C3BD" font-size="13" font-weight="400" text-anchor="start">Relative speed; complete batch timer</text><rect x="36" y="620" width="1128" height="116" rx="12" fill="#081E19" stroke="#315C53"/><text x="60" y="653" fill="#75E3B0" font-size="16" font-weight="700" text-anchor="start" letter-spacing="0.7">MATCHED REFERENCES. SEPARATE MEASUREMENT BOUNDARIES.</text><text x="60" y="683" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Batch timer: witness → prove → encode → encoded verify. Both policies parallelize witness/proving; transport is excluded.</text><text x="60" y="708" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Plonky3 supplies primitives. These internal controls do not establish a ranking against external GKR engines.</text><text x="40" y="761" fill="#A9C3BD" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.8">MEASURED V1.1.0 · SOURCE, STATISTICAL UNITS AND FULL CONDITIONS IN DOCS/PERFORMANCE.MD</text></g></svg>
