<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">StateSync-GKR: less memory, faster verification and complete local batches</title><desc id="desc">Three separate controlled comparisons within StateSync-GKR. Peak process RSS is 89.46-fold lower for Sparse versus the test-only Dense reference at mixed width 4096. Whole prepared typed verification is up to 23.68-fold faster for Derived versus Table wiring, excluding setup. Parallel output policy improves complete prepared local batch time 9.71 to 10.71-fold; witness generation and proving are parallel in both policies and transport is excluded.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset="1" stop-color="#12312D"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#75E3B0" stroke-width="1" opacity=".045"/></pattern></defs>
