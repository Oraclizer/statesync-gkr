<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">StateSync-GKR v1.2.0: memory, proving, serving rate and tail latency</title><desc id="desc">Four measured cells, each with its own baseline. Memory: 89-fold less peak process memory than the engine's own dense baseline on a mixed two-layer circuit of width 4,096 (89.46-fold measured on v1.1.0, 88.87-fold on v1.2.0; 1,811.54 MiB against 20.25 MiB in the v1.1.0 measurement). Proving: 6,470-fold faster than the dense baseline on the same circuit with v1.2.0, against 2,507-fold with v1.1.0, medians of three processes. Serving: 3,300 requests per second on one 192-core server with every request accepted within one second, against 1,150 for v1.1.0 measured the same day. Tail latency: 34 ms at the 99th percentile at 1,000 requests per second on the same server, against 440 ms for v1.1.0 the same day, medians of three 60-second runs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset="1" stop-color="#12312D"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#75E3B0" stroke-width="1" opacity=".045"/></pattern></defs><rect x="0" y="0" width="1200" height="780" rx="22" fill="url(#bg)"/><rect x="0" y="0" width="1200" height="780" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="778" rx="21" fill="none" stroke="#315C53"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="44" fill="#75E3B0" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.8">STATESYNC-GKR / REUSABLE RUST ENGINE</text><text x="40" y="105" fill="#F3F7F4" font-size="48" font-weight="700" text-anchor="start">Proofs with less repeated work.</text><text x="42" y="147" fill="#A9C3BD" font-size="21" font-weight="400" text-anchor="start">Measured on v1.2.0 · v1.1.0 shown as each cell's reference</text><rect x="36" y="176" width="552" height="212" rx="16" fill="#0A211D" stroke="#315C53"/><text x="60" y="212" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">MEMORY</text><text x="564" y="212" fill="#A9C3BD" font-size="13" font-weight="700" text-anchor="end" letter-spacing="0.6">WIDTH-4,096 TEST CIRCUIT</text><text x="60" y="274" fill="#F3F7F4" font-size="58" font-weight="700" text-anchor="start">89×</text><text x="288" y="250" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="start">89.46× measured on v1.1.0</text><text x="288" y="272" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">88.87× on v1.2.0</text><text x="60" y="304" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">less peak memory than the engine's own dense baseline</text><text x="60" y="334" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">Dense baseline</text><text x="564" y="334" fill="#A9C3BD" font-size="14" font-weight="600" text-anchor="end">1,811.54 MiB</text><rect x="60" y="341" width="504" height="8" rx="3" fill="#1A3930"/><rect x="60" y="341" width="504.0" height="8" rx="3" fill="#55786C"/><text x="60" y="364" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="start">StateSync-GKR</text><text x="564" y="364" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="end">20.25 MiB</text><rect x="60" y="371" width="504" height="8" rx="3" fill="#1A3930"/><rect x="60" y="371" width="5.63" height="8" rx="3" fill="#75E3B0"/><rect x="612" y="176" width="552" height="212" rx="16" fill="#0A211D" stroke="#315C53"/><text x="636" y="212" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">PROVING</text><text x="1140" y="212" fill="#A9C3BD" font-size="13" font-weight="700" text-anchor="end" letter-spacing="0.6">SAME CIRCUIT · MEDIAN OF 3</text><text x="636" y="274" fill="#F3F7F4" font-size="58" font-weight="700" text-anchor="start">6,470×</text><text x="864" y="250" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="start">2,507× on v1.1.0</text><text x="864" y="272" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Dense reference unchanged</text><text x="636" y="304" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">faster proving than the engine's own dense baseline</text><text x="636" y="334" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">v1.1.0</text><text x="1140" y="334" fill="#A9C3BD" font-size="14" font-weight="600" text-anchor="end">2,507×</text><rect x="636" y="341" width="504" height="8" rx="3" fill="#1A3930"/><rect x="636" y="341" width="195.32" height="8" rx="3" fill="#55786C"/><text x="636" y="364" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="start">v1.2.0</text><text x="1140" y="364" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="end">6,470×</text><rect x="636" y="371" width="504" height="8" rx="3" fill="#1A3930"/><rect x="636" y="371" width="504.0" height="8" rx="3" fill="#75E3B0"/><rect x="36" y="400" width="552" height="212" rx="16" fill="#0A211D" stroke="#315C53"/><text x="60" y="436" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">SERVING</text><text x="564" y="436" fill="#A9C3BD" font-size="13" font-weight="700" text-anchor="end" letter-spacing="0.6">ONE 192-CORE SERVER</text><text x="60" y="498" fill="#F3F7F4" font-size="58" font-weight="700" text-anchor="start">3,300/s</text><text x="288" y="474" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="start">1,150/s on v1.1.0,</text><text x="288" y="496" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">measured the same day</text><text x="60" y="528" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">requests a second, every one accepted within 1 s</text><text x="60" y="558" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">v1.1.0</text><text x="564" y="558" fill="#A9C3BD" font-size="14" font-weight="600" text-anchor="end">1,150/s</text><rect x="60" y="565" width="504" height="8" rx="3" fill="#1A3930"/><rect x="60" y="565" width="175.64" height="8" rx="3" fill="#55786C"/><text x="60" y="588" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="start">v1.2.0</text><text x="564" y="588" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="end">3,300/s</text><rect x="60" y="595" width="504" height="8" rx="3" fill="#1A3930"/><rect x="60" y="595" width="504.0" height="8" rx="3" fill="#75E3B0"/><rect x="612" y="400" width="552" height="212" rx="16" fill="#0A211D" stroke="#315C53"/><text x="636" y="436" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">TAIL LATENCY</text><text x="1140" y="436" fill="#A9C3BD" font-size="13" font-weight="700" text-anchor="end" letter-spacing="0.6">AT 1,000 REQUESTS/S</text><text x="636" y="498" fill="#F3F7F4" font-size="58" font-weight="700" text-anchor="start">34 ms</text><text x="864" y="474" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="start">440 ms on v1.1.0,</text><text x="864" y="496" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">measured the same day</text><text x="636" y="528" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">99th percentile on the same server, medians of three 60-s runs</text><text x="636" y="558" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">v1.1.0</text><text x="1140" y="558" fill="#A9C3BD" font-size="14" font-weight="600" text-anchor="end">440 ms</text><rect x="636" y="565" width="504" height="8" rx="3" fill="#1A3930"/><rect x="636" y="565" width="504.0" height="8" rx="3" fill="#55786C"/><text x="636" y="588" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="start">v1.2.0</text><text x="1140" y="588" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="end">34 ms</text><rect x="636" y="595" width="504" height="8" rx="3" fill="#1A3930"/><rect x="636" y="595" width="38.7" height="8" rx="3" fill="#75E3B0"/><rect x="36" y="628" width="1128" height="106" rx="12" fill="#081E19" stroke="#315C53"/><text x="60" y="660" fill="#75E3B0" font-size="16" font-weight="700" text-anchor="start" letter-spacing="0.7">EACH CELL KEEPS ITS OWN BASELINE. V1.1.0 WAS MEASURED ON THE SAME HOSTS.</text><text x="60" y="690" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Memory and proving: the Sparse prover against the test-only Dense reference, mixed two-layer circuit, width 4,096.</text><text x="60" y="715" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Serving and latency: separate verifying frontend, 1:1:1 mix at depth 24, from scheduled arrival to verified acceptance.</text><text x="40" y="761" fill="#A9C3BD" font-size="13" font-weight="600" text-anchor="start" letter-spacing="0.8">MEASURED V1.2.0 AND V1.1.0 · SOURCE, STATISTICAL UNITS AND FULL CONDITIONS IN DOCS/PERFORMANCE.MD</text></g></svg>
