<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1980" viewBox="0 0 480 1980" role="img" aria-labelledby="title desc">
<title id="title">Nine implementation benefits in three practical groups</title><desc id="desc">All nine mechanisms remain visible. Resource use: sparse reduction, cube and affine fusion, parallel Merkle constraints. Repeated execution: derived wiring, prepared reuse, independent proof jobs. Meaning and reuse: three-state lifecycle, strict codec and request binding, reusable sumcheck/GKR core with formal models. Evidence types differ; these are not nine independently isolated causal experiments.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset="1" stop-color="#12312D"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#75E3B0" stroke-width="1" opacity=".045"/></pattern></defs>
<rect width="480" height="1980" rx="22" fill="url(#bg)"/><rect width="480" height="1980" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="478" height="1978" rx="21" fill="none" stroke="#315C53"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="26" y="40" fill="#75E3B0" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.4">NINE MECHANISMS</text><text x="26" y="84" fill="#F3F7F4" font-size="30" font-weight="700" text-anchor="start">One reusable engine.</text><text x="26" y="125" fill="#75E3B0" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.8">USE RESOURCES WELL</text><rect x="22" y="145" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="180" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Fit more work</text><text x="44" y="209" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">within your RAM.</text><text x="44" y="243" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Sparse layer reduction</text><text x="44" y="275" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">MEASUREMENT + SOURCE</text><text x="44" y="297" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Same-driver Dense / Sparse</text><rect x="22" y="329" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="364" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Keep hash rounds</text><text x="44" y="393" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">compact.</text><text x="44" y="427" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Cube gates + affine fusion</text><text x="44" y="459" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">SOURCE STRUCTURE</text><text x="44" y="481" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">No separate speed multiplier</text><rect x="22" y="513" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="548" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Grow the path.</text><text x="44" y="577" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Keep proof growth modest.</text><text x="44" y="611" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Parallel Merkle constraints</text><text x="44" y="643" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">SHAPE + PROOF BYTES</text><text x="44" y="665" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Membership: +2.93%, depth 24 → 32</text><text x="26" y="735" fill="#75E3B0" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.8">REPEAT EFFICIENTLY</text><rect x="22" y="755" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="790" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Check familiar</text><text x="44" y="819" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">structure faster.</text><text x="44" y="853" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Derived wiring</text><text x="44" y="885" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">MEASUREMENT + MODEL</text><text x="44" y="907" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Same-proof Table / Derived</text><rect x="22" y="939" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="974" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Prepare once.</text><text x="44" y="1003" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Reuse the setup.</text><text x="44" y="1037" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Circuit + commitment reuse</text><text x="44" y="1069" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">DIRECT MEASUREMENT</text><text x="44" y="1091" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">3.46–4.45× lower per-request time</text><rect x="22" y="1123" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="1158" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Use the workers.</text><text x="44" y="1187" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Keep each result distinct.</text><text x="44" y="1221" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Independent proof jobs</text><text x="44" y="1253" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">MEASUREMENT + CONTROLS</text><text x="44" y="1275" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">One job → one proof</text><text x="26" y="1345" fill="#75E3B0" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0.8">KEEP THE MEANING</text><rect x="22" y="1365" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="1400" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Distinguish unused,</text><text x="44" y="1429" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">live and deleted state.</text><text x="44" y="1463" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Three-state leaf lifecycle</text><text x="44" y="1495" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">SEMANTICS + CONTROLS</text><text x="44" y="1517" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Empty / occupied / tombstone</text><rect x="22" y="1549" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="1584" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Accept the proof</text><text x="44" y="1613" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">for the original request.</text><text x="44" y="1647" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Strict codec + request binding</text><text x="44" y="1679" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">REJECTION CONTROLS</text><text x="44" y="1701" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Complete encoded proof checked</text><rect x="22" y="1733" width="436" height="170" rx="12" fill="#0A211D" stroke="#315C53"/><text x="44" y="1768" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">Build a different</text><text x="44" y="1797" fill="#F3F7F4" font-size="25" font-weight="700" text-anchor="start">circuit frontend.</text><text x="44" y="1831" fill="#8ED3E1" font-size="18" font-weight="600" text-anchor="start">Reusable sumcheck / GKR core</text><text x="44" y="1863" fill="#75E3B0" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0.5">SOURCE + FORMAL MODELS</text><text x="44" y="1885" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Rust connection: partial, conditional</text><text x="28" y="1911" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Evidence types differ across mechanisms.</text><text x="28" y="1937" fill="#A9C3BD" font-size="16" font-weight="400" text-anchor="start">Nine benefits do not imply nine causal experiments.</text></g></svg>
