<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1504" viewBox="0 0 480 1504" role="img" aria-labelledby="title desc">
<title id="title">StateSync-GKR: less memory, faster verification and complete local batches</title><desc id="desc">Three separate controlled comparisons within StateSync-GKR. Peak process RSS is 89.46-fold lower for Sparse versus the test-only Dense reference at mixed width 4096. Whole prepared typed verification is up to 23.68-fold faster for Derived versus Table wiring, excluding setup. Parallel output policy improves complete prepared local batch time 9.71 to 10.71-fold; witness generation and proving are parallel in both policies and transport is excluded.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset="1" stop-color="#12312D"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#75E3B0" stroke-width="1" opacity=".045"/></pattern></defs>
<rect width="480" height="1504" rx="22" fill="url(#bg)"/><rect width="480" height="1504" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="478" height="1502" rx="21" fill="none" stroke="#315C53"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="26" y="40" fill="#75E3B0" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.1">STATESYNC-GKR / RUST</text><text x="26" y="88" fill="#F3F7F4" font-size="34" font-weight="700" text-anchor="start">Proofs with less</text><text x="26" y="129" fill="#F3F7F4" font-size="34" font-weight="700" text-anchor="start">repeated work.</text><text x="26" y="163" fill="#A9C3BD" font-size="18" font-weight="400" text-anchor="start">Three measured internal comparisons</text><rect x="22" y="196" width="436" height="360" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="230" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">MEMORY</text><text x="46" y="311" fill="#F3F7F4" font-size="72" font-weight="700" text-anchor="start">89.46×</text><text x="46" y="344" fill="#A9C3BD" font-size="19" font-weight="600" text-anchor="start">lower peak process RAM</text><text x="46" y="385" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">SS-GKR Dense ref</text><text x="434" y="385" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="end">1,811.54 MiB</text><rect x="46" y="397" width="388" height="13" rx="3" fill="#55786C"/><text x="46" y="446" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="start">SS-GKR Sparse</text><text x="434" y="446" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="end">20.25 MiB</text><rect x="46" y="458" width="388" height="13" rx="3" fill="#1A3930"/><rect x="46" y="458" width="4.337196013403658" height="13" rx="0" fill="#75E3B0"/><text x="46" y="506" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Mixed, 2-layer circuit · width 4,096</text><text x="46" y="532" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Same circuit, field and prover driver</text><rect x="22" y="578" width="436" height="358" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="612" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">PREPARED VERIFICATION</text><text x="434" y="612" fill="#A9C3BD" font-size="16" font-weight="700" text-anchor="end">UP TO</text><text x="46" y="693" fill="#F3F7F4" font-size="72" font-weight="700" text-anchor="start">23.68×</text><text x="46" y="726" fill="#A9C3BD" font-size="19" font-weight="600" text-anchor="start">faster whole typed verification</text><text x="46" y="767" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Table wiring</text><text x="434" y="767" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="end">1×</text><rect x="46" y="779" width="16.166666666666668" height="13" rx="3" fill="#55786C"/><text x="46" y="828" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="start">Derived wiring</text><text x="434" y="828" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="end">23.68×</text><rect x="46" y="840" width="382.7569793488383" height="13" rx="3" fill="#75E3B0"/><text x="46" y="888" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Update · depth 32 · same proof</text><text x="46" y="914" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Preparation excluded; Table is sparse</text><rect x="22" y="958" width="436" height="358" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="992" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">COMPLETE LOCAL BATCH</text><text x="46" y="1073" fill="#F3F7F4" font-size="53" font-weight="700" text-anchor="start">9.71–10.71×</text><text x="46" y="1106" fill="#A9C3BD" font-size="19" font-weight="600" text-anchor="start">faster whole prepared batches</text><text x="46" y="1147" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Serial output</text><text x="434" y="1147" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="end">1×</text><rect x="46" y="1159" width="32.333333333333336" height="13" rx="3" fill="#55786C"/><text x="46" y="1208" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="start">Parallel output</text><text x="434" y="1208" fill="#75E3B0" font-size="15" font-weight="600" text-anchor="end">9.71–10.71×</text><rect x="46" y="1220" width="313.83316499444464" height="13" rx="3" fill="#75E3B0"/><rect x="359.83316499444464" y="1220" width="32.37523240503503" height="13" rx="0" fill="#C5F5DE"/><text x="46" y="1268" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Depth 24 · batch 768 · 192 workers</text><text x="46" y="1294" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Range spans three operation medians</text><text x="28" y="1356" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Each result uses its own matched SS-GKR reference.</text><text x="28" y="1385" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Batch timer: witness → prove → encode → verify.</text><text x="28" y="1414" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Both policies parallelize witness and proving.</text><text x="28" y="1443" fill="#A9C3BD" font-size="17" font-weight="400" text-anchor="start">Transport excluded. No external-engine ranking.</text><text x="28" y="1480" fill="#75E3B0" font-size="14" font-weight="400" text-anchor="start">Measured v1.1.0 · full conditions in performance docs</text></g></svg>
