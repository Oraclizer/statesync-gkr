<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1648" viewBox="0 0 480 1648" role="img" aria-labelledby="title desc"><title id="title">StateSync-GKR v1.2.0: memory, proving, serving rate and tail latency</title><desc id="desc">Four measured cells, each with its own baseline. Memory: 89-fold less peak process memory than the engine's own dense baseline on a mixed two-layer circuit of width 4,096 (89.46-fold measured on v1.1.0, 88.87-fold on v1.2.0; 1,811.54 MiB against 20.25 MiB in the v1.1.0 measurement). Proving: 6,470-fold faster than the dense baseline on the same circuit with v1.2.0, against 2,507-fold with v1.1.0, medians of three processes. Serving: 3,300 requests per second on one 192-core server with every request accepted within one second, against 1,150 for v1.1.0 measured the same day. Tail latency: 34 ms at the 99th percentile at 1,000 requests per second on the same server, against 440 ms for v1.1.0 the same day, medians of three 60-second runs.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset="1" stop-color="#12312D"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#75E3B0" stroke-width="1" opacity=".045"/></pattern></defs><rect x="0" y="0" width="480" height="1648" rx="22" fill="url(#bg)"/><rect x="0" y="0" width="480" height="1648" rx="22" fill="url(#grid)"/><rect x="1" y="1" width="478" height="1646" rx="21" fill="none" stroke="#315C53"/><g font-family="Arial,Helvetica,sans-serif"><text x="26" y="40" fill="#75E3B0" font-size="16" font-weight="700" text-anchor="start" letter-spacing="1.8">STATESYNC-GKR / RUST</text><text x="26" y="88" fill="#F3F7F4" font-size="34" font-weight="700" text-anchor="start">Proofs with less</text><text x="26" y="129" fill="#F3F7F4" font-size="34" font-weight="700" text-anchor="start">repeated work.</text><text x="26" y="163" fill="#A9C3BD" font-size="18" font-weight="400" text-anchor="start">Measured on v1.2.0 · v1.1.0 as reference</text><rect x="22" y="186" width="436" height="300" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="222" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">MEMORY</text><text x="434" y="222" fill="#A9C3BD" font-size="12" font-weight="700" text-anchor="end" letter-spacing="0.4">WIDTH-4,096 TEST CIRCUIT</text><text x="46" y="286" fill="#F3F7F4" font-size="58" font-weight="700" text-anchor="start">89×</text><text x="46" y="318" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="start">89.46× measured on v1.1.0</text><text x="46" y="340" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">88.87× on v1.2.0</text><text x="46" y="374" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">less peak memory than the engine's</text><text x="46" y="396" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">own dense baseline</text><text x="46" y="434" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">Dense baseline</text><text x="434" y="434" fill="#A9C3BD" font-size="14" font-weight="600" text-anchor="end">1,811.54 MiB</text><rect x="46" y="441" width="388" height="8" rx="3" fill="#1A3930"/><rect x="46" y="441" width="388.0" height="8" rx="3" fill="#55786C"/><text x="46" y="464" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="start">StateSync-GKR</text><text x="434" y="464" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="end">20.25 MiB</text><rect x="46" y="471" width="388" height="8" rx="3" fill="#1A3930"/><rect x="46" y="471" width="4.34" height="8" rx="3" fill="#75E3B0"/><rect x="22" y="502" width="436" height="300" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="538" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">PROVING</text><text x="434" y="538" fill="#A9C3BD" font-size="12" font-weight="700" text-anchor="end" letter-spacing="0.4">SAME CIRCUIT · MEDIAN OF 3</text><text x="46" y="602" fill="#F3F7F4" font-size="58" font-weight="700" text-anchor="start">6,470×</text><text x="46" y="634" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="start">2,507× on v1.1.0</text><text x="46" y="656" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Dense reference unchanged</text><text x="46" y="690" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">faster proving than the engine's</text><text x="46" y="712" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">own dense baseline</text><text x="46" y="750" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">v1.1.0</text><text x="434" y="750" fill="#A9C3BD" font-size="14" font-weight="600" text-anchor="end">2,507×</text><rect x="46" y="757" width="388" height="8" rx="3" fill="#1A3930"/><rect x="46" y="757" width="150.37" height="8" rx="3" fill="#55786C"/><text x="46" y="780" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="start">v1.2.0</text><text x="434" y="780" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="end">6,470×</text><rect x="46" y="787" width="388" height="8" rx="3" fill="#1A3930"/><rect x="46" y="787" width="388.0" height="8" rx="3" fill="#75E3B0"/><rect x="22" y="818" width="436" height="300" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="854" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">SERVING</text><text x="434" y="854" fill="#A9C3BD" font-size="12" font-weight="700" text-anchor="end" letter-spacing="0.4">ONE 192-CORE SERVER</text><text x="46" y="918" fill="#F3F7F4" font-size="58" font-weight="700" text-anchor="start">3,300/s</text><text x="46" y="950" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="start">1,150/s on v1.1.0,</text><text x="46" y="972" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">measured the same day</text><text x="46" y="1006" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">requests a second, every one</text><text x="46" y="1028" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">accepted within 1 s</text><text x="46" y="1066" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">v1.1.0</text><text x="434" y="1066" fill="#A9C3BD" font-size="14" font-weight="600" text-anchor="end">1,150/s</text><rect x="46" y="1073" width="388" height="8" rx="3" fill="#1A3930"/><rect x="46" y="1073" width="135.21" height="8" rx="3" fill="#55786C"/><text x="46" y="1096" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="start">v1.2.0</text><text x="434" y="1096" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="end">3,300/s</text><rect x="46" y="1103" width="388" height="8" rx="3" fill="#1A3930"/><rect x="46" y="1103" width="388.0" height="8" rx="3" fill="#75E3B0"/><rect x="22" y="1134" width="436" height="300" rx="16" fill="#0A211D" stroke="#315C53"/><text x="46" y="1170" fill="#75E3B0" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">TAIL LATENCY</text><text x="434" y="1170" fill="#A9C3BD" font-size="12" font-weight="700" text-anchor="end" letter-spacing="0.4">AT 1,000 REQUESTS/S</text><text x="46" y="1234" fill="#F3F7F4" font-size="58" font-weight="700" text-anchor="start">34 ms</text><text x="46" y="1266" fill="#A9C3BD" font-size="15" font-weight="600" text-anchor="start">440 ms on v1.1.0,</text><text x="46" y="1288" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">measured the same day</text><text x="46" y="1322" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">99th percentile on the same server,</text><text x="46" y="1344" fill="#A9C3BD" font-size="16" font-weight="600" text-anchor="start">medians of three 60-s runs</text><text x="46" y="1382" fill="#A9C3BD" font-size="14" font-weight="400" text-anchor="start">v1.1.0</text><text x="434" y="1382" fill="#A9C3BD" font-size="14" font-weight="600" text-anchor="end">440 ms</text><rect x="46" y="1389" width="388" height="8" rx="3" fill="#1A3930"/><rect x="46" y="1389" width="388.0" height="8" rx="3" fill="#55786C"/><text x="46" y="1412" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="start">v1.2.0</text><text x="434" y="1412" fill="#75E3B0" font-size="14" font-weight="600" text-anchor="end">34 ms</text><rect x="46" y="1419" width="388" height="8" rx="3" fill="#1A3930"/><rect x="46" y="1419" width="29.79" height="8" rx="3" fill="#75E3B0"/><rect x="22" y="1452" width="436" height="156" rx="12" fill="#081E19" stroke="#315C53"/><text x="44" y="1482" fill="#75E3B0" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0.5">EACH CELL KEEPS ITS OWN BASELINE.</text><text x="44" y="1504" fill="#75E3B0" font-size="14" font-weight="700" text-anchor="start" letter-spacing="0.5">V1.1.0 WAS MEASURED ON THE SAME HOSTS.</text><text x="44" y="1526" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Memory and proving: Sparse prover against the</text><text x="44" y="1548" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">test-only Dense reference, width 4,096.</text><text x="44" y="1570" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">Serving and latency: separate frontend, 1:1:1</text><text x="44" y="1592" fill="#A9C3BD" font-size="15" font-weight="400" text-anchor="start">mix, scheduled arrival to verified acceptance.</text><text x="26" y="1626" fill="#75E3B0" font-size="14" font-weight="400" text-anchor="start">Measured v1.2.0 and v1.1.0 · full conditions in docs</text></g></svg>
