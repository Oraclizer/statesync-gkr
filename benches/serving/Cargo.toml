[package]
name = "ssgkr-serving"
version = "0.1.0"
edition = "2024"
publish = false
license = "BUSL-1.1"
description = "Serving components and a reference proof server for StateSync-GKR"

# Standalone on purpose: the product workspace, its lock file and the
# protected release sources stay unchanged. Shared dependency versions match
# the product lock file.
[workspace]

[lib]
name = "ssgkr_serving"
path = "src/lib.rs"

[[bin]]
name = "ssgkr-serving"
path = "src/bin/ssgkr-serving/main.rs"

[dependencies]
statesync-gkr = { path = "../.." }
rayon = "=1.12.0"
sha2 = "=0.11.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[dev-dependencies]
p3-challenger = "=0.4.3"

[lints.rust]
unsafe_code = "forbid"
